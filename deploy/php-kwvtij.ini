; ຄ່າ PHP ສຳລັບ Kwv Tij Hmoob Xyooj — ຕິດຕັ້ງທີ່ /etc/php/8.3/fpm/conf.d/99-kwvtij.ini
upload_max_filesize = 55M
post_max_size = 256M
max_file_uploads = 25
memory_limit = 256M
max_execution_time = 120
expose_php = Off
date.timezone = Asia/Vientiane

; OPcache ສຳລັບ production (reload php-fpm ຫຼັງ deploy ທຸກຄັ້ງ)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

session.cookie_httponly = 1
session.use_strict_mode = 1
