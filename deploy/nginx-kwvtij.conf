# Nginx ສຳລັບ Kwv Tij Hmoob Xyooj — server-setup.sh ຈະແທນ __DOMAIN__ ແລະ __APP_DIR__ ໃຫ້
# HTTPS: certbot --nginx ຈະເພີ່ມ SSL ແລະ redirect HTTP → HTTPS ໃຫ້ອັດຕະໂນມັດ
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __APP_DIR__/public;          # ຊີ້ໄປ public/ ເທົ່ານັ້ນ — ໄຟລ໌ເອກະສານຢູ່ storage/ ນອກ web root
    index index.php;
    charset utf-8;

    client_max_body_size 256M;        # multi-file gallery uploads (images ≤ 10 MB, video ≤ 50 MB each)
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # asset ທີ່ build ແລ້ວ (ຊື່ມີ hash) — cache ດົນໄດ້
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # ຫ້າມ execute PHP ໃນ storage (ຮູບຂ່າວ) ແລະ ຫ້າມເຂົ້າໄຟລ໌ຊ່ອນ (.env, .git)
    location ~ ^/storage/.*\.php$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }
}
